server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: service-stock
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alzheimer_stock}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

app:
  upload:
    dir: uploads
  jwt:
    secret: ${JWT_SECRET:f8a3b7c1e9d2a4f6b8c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8}
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
  frontend-url: ${FRONTEND_URL:https://semahkadri.github.io/alzheimer-detection}
  mail:
    admin-email: admin@pharmacare.tn
  ai:
    api-key: ${AI_API_KEY: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}
    api-url: https://openrouter.ai/api/v1/chat/completions
    model: qwen/qwen3.6-plus:free
    enabled: ${AI_ENABLED:true}
  cors:
    allowed-origins: http://localhost:4200,https://semahkadri.github.io

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
